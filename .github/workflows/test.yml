name: gotest

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gotest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
      - name: Test Go code
        run: go test ./...
      - name: Run Go vet
        run: go vet ./...
      - name: Run Staticcheck
        uses: dominikh/staticcheck-action@v1.4.1
        with:
          version: "2026.2.2"
          install-go: false

  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
